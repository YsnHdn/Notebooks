name: Sync Portfolio Submodule

on:
  push:
    branches:
      - main

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Portfolio repo
        uses: actions/checkout@v4
        with:
          repository: YsnHdn/Portfolio
          token: ${{ secrets.PAT_TOKEN }}
          submodules: true

      - name: Update notebooks submodule
        run: |
          cd data/blog/notebooks
          git fetch origin main
          git reset --hard origin/main
          cd ../../..

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blog/notebooks
          git commit -m "🤖 Auto-update notebooks submodule to ${{ github.sha }}" || exit 0
          git push origin main
